apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - objectbucketclaim.yaml
  - odf-secret-sync-job.yaml

patches:
  - path: lokistack-cr-patch.yaml
    target:
      group: loki.grafana.com
      version: v1
      kind: LokiStack
      name: logging-loki
  - path: lokistack-placement-patch.yaml
    target:
      group: loki.grafana.com
      version: v1
      kind: LokiStack
      name: logging-loki
  - path: lokistack-sync-wave-patch.yaml
    target:
      group: loki.grafana.com
      version: v1
      kind: LokiStack
      name: logging-loki
  # Drop the placeholder CA ConfigMap; ODF uses openshift-service-ca.crt
  - target:
      kind: ConfigMap
      name: loki-s3-ca-bundle
      namespace: openshift-logging
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: loki-s3-ca-bundle
  # Drop placeholder S3 secret; the sync Job creates the real secret from the OBC.
  # Argo Application ignoreDifferences / Prune=false annotations keep it stable.
  - target:
      kind: Secret
      name: logging-loki-s3
      namespace: openshift-logging
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: logging-loki-s3
