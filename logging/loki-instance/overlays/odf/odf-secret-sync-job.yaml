# Converts the OBC-generated Secret/ConfigMap into the LokiStack S3 secret format.
# Runs once after the ObjectBucketClaim is Bound. Safe to re-apply (idempotent).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-odf-secret-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-odf-secret-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-odf-secret-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-odf-secret-sync
subjects:
  - kind: ServiceAccount
    name: loki-odf-secret-sync
    namespace: openshift-logging
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-odf-secret-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: loki-odf-secret-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OBC_NAME
              value: logging-loki-obc
            - name: LOKI_SECRET_NAME
              value: logging-loki-s3
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              echo "Waiting for ObjectBucketClaim ${OBC_NAME} to be Bound..."
              for i in $(seq 1 60); do
                phase="$(oc get objectbucketclaim "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                if [[ "${phase}" == "Bound" ]]; then
                  break
                fi
                sleep 5
              done
              phase="$(oc get objectbucketclaim "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}')"
              if [[ "${phase}" != "Bound" ]]; then
                echo "ERROR: ObjectBucketClaim ${OBC_NAME} not Bound (phase=${phase})"
                exit 1
              fi

              ACCESS_KEY="$(oc get secret "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
              SECRET_KEY="$(oc get secret "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
              BUCKET="$(oc get configmap "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_NAME}')"
              HOST="$(oc get configmap "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_HOST}')"
              PORT="$(oc get configmap "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_PORT}')"
              REGION="$(oc get configmap "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_REGION}')"

              if [[ -z "${PORT}" || "${PORT}" == "443" ]]; then
                ENDPOINT="https://${HOST}"
              else
                ENDPOINT="https://${HOST}:${PORT}"
              fi
              REGION="${REGION:-us-east-1}"

              echo "Creating/updating Loki S3 secret ${LOKI_SECRET_NAME} (bucket=${BUCKET}, endpoint=${ENDPOINT})"
              oc create secret generic "${LOKI_SECRET_NAME}" \
                -n "${NAMESPACE}" \
                --from-literal=access_key_id="${ACCESS_KEY}" \
                --from-literal=access_key_secret="${SECRET_KEY}" \
                --from-literal=bucketnames="${BUCKET}" \
                --from-literal=endpoint="${ENDPOINT}" \
                --from-literal=region="${REGION}" \
                --from-literal=forcepathstyle="true" \
                --dry-run=client -o yaml \
              | oc annotate -f - \
                  argocd.argoproj.io/compare-options=IgnoreExtraneous \
                  argocd.argoproj.io/sync-options=Prune=false \
                  --local -o yaml \
              | oc apply -f -
              echo "Done."
