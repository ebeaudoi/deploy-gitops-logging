apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-s3-ca-bundle
  namespace: openshift-logging
data:
  # CA that signs the S3/S4 API endpoint certificate.
  # Replace via HEADER FETCH_S3_CA=true (and optionally S3_CA_FILE), then ./configure-overlays.sh
  service-ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OBJECT_STORAGE_CA
    -----END CERTIFICATE-----
