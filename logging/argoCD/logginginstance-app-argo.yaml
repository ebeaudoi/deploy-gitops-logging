apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-instance
  namespace: openshift-gitops
spec:
  project: applogging
  source:
    repoURL: https://github.com/EXAMPLE/deploy-gitops-logging.git
    targetRevision: HEAD
    path: logging/instance/base
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
