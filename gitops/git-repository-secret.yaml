# Argo CD repository credentials (HTTPS).
# Generated by configure-overlays.sh (GIT_* HEADER values).
# Apply with: oc apply -f gitops/git-repository-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: git-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: git-repo
  url: https://github.com/EXAMPLE/deploy-gitops-logging.git
  insecure: "true"
  username: ""
  password: ""
